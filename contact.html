<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us — Offline Objects</title>
    <meta
      name="description"
      content="Contact Offline Objects — reach the team for press, partnerships, and questions about Sensoria."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>

    <header class="site-header">
      <a class="wordmark" href="index.html">offline objects</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="books-events.html">books &amp; events</a>
        <a href="about.html">about</a>
        <a href="contact.html" aria-current="page">contact</a>
      </nav>
    </header>

    <main>
      <section class="page-hero" aria-label="Contact">
        <div class="page-aura" data-aura aria-hidden="true">
          <span class="blob blob-gold"></span>
          <span class="blob blob-peach"></span>
          <span class="blob blob-rose"></span>
          <span class="blob blob-lilac"></span>
          <span class="blob blob-blue"></span>
        </div>
        <div class="page-hero-copy">
          <p class="eyebrow">contact us</p>
          <h1>Say hello.</h1>
          <p class="lede">
            Press, partnerships, rights, or a quiet note—
            write us and we’ll get back to you.
          </p>
        </div>
      </section>

      <section class="page-content reveal-section">
        <div class="contact-layout">
          <div class="prose">
            <h2>Direct line</h2>
            <ul class="contact-list">
              <li>
                <span>Email</span>
                <a href="mailto:dearofflineobjects@gmail.com">dearofflineobjects@gmail.com</a>
              </li>
            </ul>
          </div>

          <form class="stack-form" data-contact-form action="#" method="post">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="contact-email">Email</label>
              <input
                id="contact-email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="field">
              <label for="topic">Topic</label>
              <select id="topic" name="topic">
                <option value="general">General</option>
                <option value="press">Press</option>
                <option value="partnership">Partnership</option>
                <option value="rights">Rights</option>
                <option value="events">Events</option>
              </select>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="6" required></textarea>
            </div>
            <button type="submit" class="text-submit">Send message</button>
            <p class="form-note" data-contact-note hidden></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <nav class="footer-nav" aria-label="Footer">
        <a href="books-events.html">books &amp; events</a>
        <a href="about.html">about</a>
        <a href="contact.html">contact</a>
      </nav>
      <p>© <span data-year></span> Offline Objects</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
